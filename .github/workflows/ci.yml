name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; the deploy job re-declares the Pages
# permissions it needs (repo default is also read-only — this makes it
# explicit in-tree).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Custom domain farsidelab.com serves at the root (since 2026-08-04;
      # DNS-RUNBOOK.md §5). Build and budget check must agree on the base path.
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run budgets
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
